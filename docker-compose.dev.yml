services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: northstar_blog
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: "${BLOG_DEV_DB_PASSWORD:?Set BLOG_DEV_DB_PASSWORD in your local environment}"
      MYSQL_ROOT_PASSWORD: "${BLOG_DEV_ROOT_PASSWORD:?Set BLOG_DEV_ROOT_PASSWORD in your local environment}"
    ports: ['127.0.0.1:3306:3306']
    volumes: [northstar_mysql:/var/lib/mysql]
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  northstar_mysql:
